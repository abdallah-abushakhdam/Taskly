<div class="page-wrapper">
  <!-- Logo -->
  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <rect width="18" height="18" rx="4" fill="#0D3086" />
      <path
        d="M5 9l3 3 5-5"
        stroke="#fff"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    TASKLY
  </div>

  <!-- Card -->
  <div class="card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Please enter your details to access your workspace</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="form-group">
        <label>EMAIL</label>
        <input
          type="email"
          formControlName="email"
          placeholder="yourname@company.com"
          [class.invalid]="isInvalid('email')"
        />
        @if (isInvalid('email')) {
          <span class="error">Please enter a valid email.</span>
        }
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>PASSWORD</label>
        <div class="input-wrap">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            [class.invalid]="isInvalid('password')"
          />
          <button type="button" class="eye-btn" (click)="showPassword = !showPassword">
            <svg
              width="22"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              @if (showPassword) {
                <path
                  d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"
                />
                <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" />
                <line x1="1" y1="1" x2="23" y2="23" />
              } @else {
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              }
            </svg>
          </button>
        </div>
        @if (isInvalid('password')) {
          <span class="error">Password is required.</span>
        }
      </div>

      <!-- Remember Me + Forgot Password -->
      <div class="form-meta">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="rememberMe" />
          Remember Me
        </label>
        <a routerLink="/auth/forgot-password" class="forgot-link">Forgot Password?</a>
      </div>

      <!-- Error -->
      @if (errorMessage) {
        <span class="error text-center">{{ errorMessage }}</span>
      }

      <!-- Submit -->
      <button type="submit" class="btn-primary">Log In</button>
    </form>

    <!-- Footer -->
    <p class="auth-footer">Don't have an account? <a routerLink="/auth/register">Sign Up</a></p>
  </div>
</div>
